name: macOS Hardware Encoder Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'alvr/encoder_macos/**'
      - 'alvr/server_core/**'
      - 'alvr/server_openvr/**'
      - '.github/workflows/arm64-encoder.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos-encoder:
    name: Build macOS Encoder Helper
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2

      - name: Build macOS Encoder
        run: |
          cd alvr/encoder_macos
          swift build -c release

      - name: Upload macOS Encoder
        uses: actions/upload-artifact@v4
        with:
          name: alvr-encoder-macos
          path: alvr/encoder_macos/.build/release/ALVREncoderHelper
          retention-days: 30

  # 构建 Windows ARM64 Streamer
  build-streamer-arm64:
    name: Build Streamer (Windows ARM64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: streamer-windows-arm64

      - name: Prepare deps
        run: cargo xtask prepare-deps --platform windows --gpl

      - name: Build streamer (ARM64)
        run: cargo build -p alvr_server_openvr -p alvr_dashboard --target aarch64-pc-windows-msvc --release --features alvr_server_openvr/gpl
        # Note: xtask build-streamer might not support passing --target easily without env vars
        # We manually build the components or use env vars if xtask supports them.

      - name: Upload Streamer
        uses: actions/upload-artifact@v4
        with:
          name: alvr-streamer-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/
          retention-days: 30
